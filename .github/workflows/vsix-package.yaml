name: VSIX Package

run-name: VSIX • ${{ github.ref_name }} • ${{ github.event_name }}

on:
  push:
    branches:
      - main
    tags:
      # Publishes for release tags (e.g. 1.2.0) and pre-release tags (e.g. 1.0.0-rc, 2.0.0-rc.1, 2.0.0-beta)
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

# The workflow only needs repository read access.
permissions:
  contents: read

# Cancel superseded branch/PR builds, but never cancel release-tag builds.
concurrency:
  group: vsix-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build (${{ matrix.os }})
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        os:
          # - macos-latest
          - ubuntu-latest
          # - windows-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout extension
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        # Frozen lockfile provides reproducible installs.
        # Ignoring lifecycle scripts reduces install-time supply-chain risk.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run test:compile

      - name: Run tests
        run: bun run test

      - name: Build extension
        run: bun run build

  publish:
    name: Publish to VS Code Marketplace
    environment: production
    if: startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout extension
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(bun -p "require('./package.json').version")"

          if [[ "$GITHUB_REF_NAME" != "$PACKAGE_VERSION" && "$GITHUB_REF_NAME" != "$PACKAGE_VERSION"-* ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match package.json version '$PACKAGE_VERSION' or a pre-release tag derived from it."
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run test:compile

      - name: Run tests
        run: bun run test

      - name: Build extension
        run: bun run build

      - name: Publish extension
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "Publishing pre-release package ($GITHUB_REF_NAME) to VS Code Marketplace..."
            bun run deploy:pre-release
          else
            echo "Publishing release package ($GITHUB_REF_NAME) to VS Code Marketplace..."
            bun run deploy
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
